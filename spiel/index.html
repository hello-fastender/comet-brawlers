<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comet Brawlers Scheibe</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; background: #000; outline: none; image-rendering: crisp-edges; image-rendering: pixelated; }
  #meldung { position: fixed; left: 8px; bottom: 8px; color: #f2f4f8; font: 14px monospace; white-space: pre-wrap; }
</style>
</head>
<body>
<canvas id="bild" width="768" height="448" tabindex="0" aria-label="Comet Brawlers, vertikale Scheibe"></canvas>
<div id="meldung"></div>
<!-- Bau: npm run bauen (tsc -p tsconfig.browser.json nach dist/); Start: npm start, dann http://localhost:8080/ -->
<!-- Grafik: main.js lädt vor dem ersten Bild die Blätter aus grafik/ausgabe/ (docs/grafik.md 9), nach blaetter.json die Grok-Fassung, wenn gebaut (9.10); ?platzhalter=1 zeichnet die Rechtecke, ebenso wenn ein Blatt nicht lädt (Meldung in der Konsole). -->
<!-- Bild: 768 × 448 Bildpixel (zwei je Spielpixel, E25); main.js skaliert das Canvas ganzzahlig auf das Fenster, in einem Fenster unter 768 × 448 Gerätepixeln weich verkleinert. -->
<script type="module" src="dist/darstellung/main.js" onerror="document.getElementById('meldung').textContent = 'dist/darstellung/main.js fehlt: zuerst im Ordner spiel/ npm run bauen ausführen.'"></script>
</body>
</html>
